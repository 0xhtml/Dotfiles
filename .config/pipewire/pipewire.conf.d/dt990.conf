context.modules = [
	{
		name = "libpipewire-module-filter-chain"
		args = {
			node.description = "DT-990 Parametric EQ"
			node.passive = true
			filter.graph = {
				nodes = [
					{
						type = builtin
						name = dt990_eq
						label = param_eq
						config = {
							filename = "/home/finn/.config/pipewire/dt990.txt"
						}
					}
					{
						type = builtin
						name = post_gain_left
						label = linear
						control = { "Mult" = 1.3804 }
					}
					{
						type = builtin
						name = post_gain_right
						label = linear
						control = { "Mult" = 1.3804 }
					}
					{
						type = ladspa
						name = limiter
						plugin = fast_lookahead_limiter_1913
						label = fastLookaheadLimiter
						control = {
							"Limit (dB)" = -1.0
							"Release Time (s)" = 0.2
						}
					}
				]
				links = [
					{ output = "dt990_eq:Out 1" input = "post_gain_left:In" }
					{ output = "dt990_eq:Out 2" input = "post_gain_right:In" }
					{ output = "post_gain_left:Out" input = "limiter:Input 1" }
					{ output = "post_gain_right:Out" input = "limiter:Input 2" }
				]
				inputs = [ "dt990_eq:In 1" "dt990_eq:In 2" ]
				outputs = [ "limiter:Output 1" "limiter:Output 2" ]
			}
			capture.props = {
				node.name = "dt990_input"
				node.passive = true
				media.class = "Audio/Sink"
				audio.channels = 2
				audio.position = [ FL FR ]
			}
			playback.props = {
				node.name = "dt990_output"
				node.passive = true
				target.object = "alsa_output.usb-Focusrite_Scarlett_Solo_USB_Y7A8JQZ2A6A096-00.HiFi__Line__sink"
			}
		}
	}
]
